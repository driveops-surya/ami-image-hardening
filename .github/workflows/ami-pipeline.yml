name: AMI Security Pipeline - ap-south-1

on:
  schedule:
    - cron: '0 12 * * *'  # Daily at 12:00 PM UTC (5:30 PM IST)
  workflow_dispatch:
    inputs:
      os_type:
        description: 'OS Type (rhel/amazonlinux/both)'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - rhel
          - amazonlinux
      force_build:
        description: 'Force build even if no vulnerabilities?'
        required: false
        default: 'false'
        type: boolean

env:
  AWS_REGION: ap-south-1
  AWS_DEFAULT_REGION: ap-south-1
  PACKER_LOG: 1
  ANSIBLE_HOST_KEY_CHECKING: False

jobs:
  fetch-latest-amis:
    runs-on: ubuntu-latest
    outputs:
      rhel_ami: ${{ steps.fetch.outputs.rhel_ami }}
      amzn_ami: ${{ steps.fetch.outputs.amzn_ami }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Fetch latest AMIs
        id: fetch
        run: |
          chmod +x scripts/fetch_ami.sh
          ./scripts/fetch_ami.sh ./reports
          echo "rhel_ami=$(jq -r '.amis.rhel.ami_id' reports/latest_amis.json)" >> $GITHUB_OUTPUT
          echo "amzn_ami=$(jq -r '.amis.amazonlinux.ami_id' reports/latest_amis.json)" >> $GITHUB_OUTPUT
      
      - name: Upload AMI info
        uses: actions/upload-artifact@v4
        with:
          name: ami-info
          path: reports/latest_amis.json

  build-and-harden:
    needs: fetch-latest-amis
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [rhel, amazonlinux]
        exclude:
          - os: rhel
            condition: ${{ github.event.inputs.os_type == 'amazonlinux' }}
          - os: amazonlinux
            condition: ${{ github.event.inputs.os_type == 'rhel' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Setup Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: 'latest'
      
      - name: Setup Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible ansible-lint boto3 botocore
          cd ansible
          ansible-galaxy collection install community.general amazon.aws
      
      - name: Validate Packer template
        run: |
          cd packer
          packer init ${OS}.pkr.hcl
          packer validate -var-file=variables.pkr.hcl ${OS}.pkr.hcl
        env:
          OS: ${{ matrix.os }}
      
      - name: Build AMI with Packer
        id: packer_build
        run: |
          cd packer
          packer build -machine-readable ${OS}.pkr.hcl | tee build.log
          AMI_ID=$(grep -oP 'ami-\K[0-9a-f]+' build.log | tail -1)
          echo "ami_id=ami-$AMI_ID" >> $GITHUB_OUTPUT
          echo "ami_id_value=ami-$AMI_ID" >> $GITHUB_OUTPUT
        env:
          OS: ${{ matrix.os }}
      
      - name: Wait for AMI to be ready
        run: |
          aws ec2 wait image-available --region ${{ env.AWS_REGION }} --image-ids ${{ steps.packer_build.outputs.ami_id }}
          echo "AMI ${{ steps.packer_build.outputs.ami_id }} is ready"
      
      - name: Upload Packer manifest
        uses: actions/upload-artifact@v4
        with:
          name: packer-manifest-${{ matrix.os }}-${{ github.run_id }}
          path: packer/manifest-${{ matrix.os }}.json
      
      - name: Set AMI output
        id: set_output
        run: |
          echo "built_ami_id=${{ steps.packer_build.outputs.ami_id }}" >> $GITHUB_OUTPUT

  vulnerability-scan:
    needs: build-and-harden
    runs-on: ubuntu-latest
    if: always()
    strategy:
      matrix:
        os: [rhel, amazonlinux]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Get AMI ID from build job
        id: get_ami
        run: |
          # In a real scenario, you'd get this from the build job output
          # For this example, we'll use a placeholder
          echo "ami_id=${{ needs.build-and-harden.outputs.built_ami_id }}" >> $GITHUB_OUTPUT
      
      - name: Launch test instance
        id: launch
        run: |
          INSTANCE_ID=$(aws ec2 run-instances \
            --region ${{ env.AWS_REGION }} \
            --image-id ${{ steps.get_ami.outputs.ami_id }} \
            --instance-type t3.micro \
            --security-group-ids ${{ secrets.SECURITY_GROUP_ID }} \
            --subnet-id ${{ secrets.SUBNET_ID }} \
            --tag-specifications 'ResourceType=instance,Tags=[{Key=Name,Value=Qualys-Scan-Test}]' \
            --query 'Instances[0].InstanceId' \
            --output text)
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "Launched instance: $INSTANCE_ID"
          
          # Wait for instance to be running
          aws ec2 wait instance-running --region ${{ env.AWS_REGION }} --instance-ids $INSTANCE_ID
          sleep 60  # Wait for cloud-init and services
      
      - name: Run Qualys vulnerability scan
        id: qualys
        run: |
          python3 scripts/qualys_scan.py \
            --instance-id ${{ steps.launch.outputs.instance_id }} \
            --region ${{ env.AWS_REGION }} \
            --output-dir ./reports
      
      - name: Parse scan report
        id: parse
        run: |
          python3 scripts/parse_report.py \
            --report-file ./reports/qualys_scan_${{ steps.launch.outputs.instance_id }}.json \
            --output-dir ./reports \
            --ami-id ${{ steps.get_ami.outputs.ami_id }} \
            --os-type ${{ matrix.os }}
      
      - name: Decision Logic - Tag AMI if Clean
        if: steps.parse.outputs.vulnerability_count == '0'
        run: |
          aws ec2 create-tags \
            --region ${{ env.AWS_REGION }} \
            --resources ${{ steps.get_ami.outputs.ami_id }} \
            --tags Key=hardened,Value=true \
                   Key=security,Value=passed \
                   Key=scan-status,Value=clean \
                   Key=scan-date,Value=$(date +%Y-%m-%d) \
                   Key=scanned-by,Value=Qualys
          echo "✅ AMI tagged as hardened and secure"
      
      - name: Decision Logic - Generate Failure Report
        if: steps.parse.outputs.vulnerability_count != '0'
        run: |
          REPORT_DATE=$(date +%Y-%m-%d-%H%M%S)
          
          # Upload reports to S3
          aws s3 cp ./reports/vulnerability_report.html \
            s3://${{ secrets.REPORT_BUCKET }}/failures/${{ matrix.os }}/$REPORT_DATE.html
          aws s3 cp ./reports/vulnerability_report.csv \
            s3://${{ secrets.REPORT_BUCKET }}/failures/${{ matrix.os }}/$REPORT_DATE.csv
          
          # Tag AMI as failed
          aws ec2 create-tags \
            --region ${{ env.AWS_REGION }} \
            --resources ${{ steps.get_ami.outputs.ami_id }} \
            --tags Key=hardened,Value=false \
                   Key=security,Value=failed \
                   Key=scan-status,Value=vulnerable \
                   Key=vulnerability-count,Value=${{ steps.parse.outputs.vulnerability_count }}
          
          echo "❌ Found ${{ steps.parse.outputs.vulnerability_count }} vulnerabilities"
          echo "Reports uploaded to S3 bucket: ${{ secrets.REPORT_BUCKET }}"
          # Don't fail the workflow, just report
      
      - name: Cleanup test instance
        if: always()
        run: |
          if [ -n "${{ steps.launch.outputs.instance_id }}" ]; then
            aws ec2 terminate-instances \
              --region ${{ env.AWS_REGION }} \
              --instance-ids ${{ steps.launch.outputs.instance_id }}
            echo "Terminated instance: ${{ steps.launch.outputs.instance_id }}"
          fi
      
      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualys-reports-${{ matrix.os }}-${{ github.run_id }}
          path: |
            ./reports/*.html
            ./reports/*.csv
            ./reports/*.json
          retention-days: 30

  security-compliance-report:
    runs-on: ubuntu-latest
    needs: [vulnerability-scan]
    if: always()
    env:
      SNS_TOPIC_ARN: ${{ secrets.SNS_TOPIC_ARN }}

    steps:
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: ./all-reports
      
      - name: Generate compliance summary
        run: |
          cat > compliance-summary.md << 'EOF'
          # AMI Security Compliance Report
          
          ## Pipeline Execution Details
          - **Date**: $(date)
          - **Region**: ap-south-1
          - **Trigger**: ${{ github.event_name }}
          - **Run ID**: ${{ github.run_id }}
          
          ## Scan Results Summary
          EOF
          
          # Add results from each OS
          find ./all-reports -name "summary_report.json" -exec echo "Found report: {}" \;
          
          echo "## Overall Status" >> compliance-summary.md
          echo "✅ Pipeline completed successfully" >> compliance-summary.md
          
          cat compliance-summary.md
      
      - name: Upload compliance report
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report
          path: compliance-summary.md
          
      - name: Send notification (if configured)
        if: ${{ env.SNS_TOPIC_ARN != '' }}
        run: |
          aws sns publish \
            --region ${{ env.AWS_REGION }} \
            --topic-arn ${{ env.SNS_TOPIC_ARN }} \
            --subject "AMI Pipeline Complete - ${{ github.run_id }}" \
            --message "AMI security pipeline completed. Check GitHub Actions for details."