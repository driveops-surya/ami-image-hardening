name: AMI Security Pipeline - ap-south-1

on:
  schedule:
    - cron: '0 12 * * *'  # Daily at 12:00 PM UTC (5:30 PM IST)
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if vulnerabilities?'
        required: false
        type: boolean

env:
  AWS_REGION: ap-south-1
  AWS_DEFAULT_REGION: ap-south-1
  PACKER_LOG: 1
  ANSIBLE_HOST_KEY_CHECKING: False
  TRIVY_SEVERITY: 'CRITICAL,HIGH,MEDIUM'
  TRIVY_EXIT_CODE: '1'  # Fail on vulnerabilities
  TRIVY_IGNORE_UNFIXED: 'false'

jobs:
  fetch-latest-amis:
    runs-on: ubuntu-latest
    outputs:
      rhel_ami: ${{ steps.fetch.outputs.rhel_ami }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Fetch latest RHEL AMI
        id: fetch
        run: |
          chmod +x scripts/fetch_ami.sh
          ./scripts/fetch_ami.sh ./reports
          echo "rhel_ami=$(jq -r '.amis.rhel.ami_id' reports/latest_amis.json)" >> $GITHUB_OUTPUT
      
      - name: Upload AMI info
        uses: actions/upload-artifact@v4
        with:
          name: ami-info
          path: reports/latest_amis.json

  build-and-harden:
    needs: fetch-latest-amis
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      built_ami_id: ${{ steps.set_output.outputs.built_ami_id }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Setup Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: 'latest'
      
      - name: Setup Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible ansible-lint boto3 botocore
          cd ansible
          ansible-galaxy collection install community.general amazon.aws
      
      - name: Validate Packer template
        run: |
          cd packer
          packer init .
          packer validate .
      
      - name: Build AMI with Packer
        id: packer_build
        run: |
          cd packer
          BUILD_TIMESTAMP=$(date -Iseconds)
          BUILD_ID=$(echo "$GITHUB_SHA" | cut -c1-7)
          packer init .
          packer build -machine-readable \
            -var-file=variables.pkrvars.hcl \
            -var "build_timestamp=$BUILD_TIMESTAMP" \
            -var "build_id=$BUILD_ID" \
            -only=amazon-ebs.rhel . 2>&1 | tee build.log
          
          AMI_ID=$(grep -oE 'ami-[0-9a-f]{17}' build.log | head -1)
          if [ -z "$AMI_ID" ]; then
            AMI_ID=$(grep -oE 'ami-[0-9a-f]{8}' build.log | head -1)
          fi
          
          if [ -z "$AMI_ID" ]; then
            echo "Failed to extract AMI ID from build log"
            exit 1
          fi
          
          echo "ami_id=$AMI_ID" >> $GITHUB_OUTPUT
          echo "built_ami_id=$AMI_ID" >> $GITHUB_OUTPUT
          echo "Built AMI: $AMI_ID"
        
      - name: Wait for AMI to be ready
        timeout-minutes: 60
        run: |
          aws ec2 wait image-available --region ${{ env.AWS_REGION }} --image-ids ${{ steps.packer_build.outputs.ami_id }}
          echo "AMI ${{ steps.packer_build.outputs.ami_id }} is ready"
      
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packer-build-log-${{ github.run_id }}
          path: packer/build.log
      
      - name: Set AMI output
        id: set_output
        run: |
          echo "built_ami_id=${{ steps.packer_build.outputs.ami_id }}" >> $GITHUB_OUTPUT

  vulnerability-scan:
    needs: build-and-harden
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Get AMI ID from build output
        id: get_ami
        run: |
          AMI_ID="${{ needs.build-and-harden.outputs.built_ami_id }}"
          if [ -z "$AMI_ID" ]; then
            echo "No AMI ID found from build-and-harden outputs" >&2
            exit 1
          fi
          echo "ami_id=$AMI_ID" >> $GITHUB_OUTPUT
          echo "Found AMI: $AMI_ID"
      
      - name: Launch test instance
        id: launch
        run: |
          INSTANCE_ID=$(aws ec2 run-instances \
            --region ${{ env.AWS_REGION }} \
            --image-id ${{ steps.get_ami.outputs.ami_id }} \
            --instance-type t3.micro \
            --key-name ami-hardening \
            --associate-public-ip-address \
            --security-group-ids ${{ secrets.SECURITY_GROUP_ID }} \
            --subnet-id ${{ secrets.SUBNET_ID }} \
            --tag-specifications 'ResourceType=instance,Tags=[{Key=Name,Value=Trivy-Scan-Test-RHEL}]' \
            --query 'Instances[0].InstanceId' \
            --output text)
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "Launched instance: $INSTANCE_ID"
          
          aws ec2 wait instance-running --region ${{ env.AWS_REGION }} --instance-ids $INSTANCE_ID
          
          # Get instance public IP for SSH
          INSTANCE_IP=$(aws ec2 describe-instances \
            --region ${{ env.AWS_REGION }} \
            --instance-ids $INSTANCE_ID \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          echo "instance_ip=$INSTANCE_IP" >> $GITHUB_OUTPUT
          echo "Instance IP: $INSTANCE_IP"
          
          sleep 60  # Wait for cloud-init and services
      
      - name: Setup SSH for Trivy scan
        run: |
          # Create SSH key file
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem
          
          # Wait for SSH to be ready
          for i in {1..30}; do
            if ssh -o StrictHostKeyChecking=no -i private_key.pem -o ConnectTimeout=5 ec2-user@${{ steps.launch.outputs.instance_ip }} "echo 'SSH ready'" 2>/dev/null; then
              echo "SSH is ready"
              break
            fi
            echo "Waiting for SSH... ($i/30)"
            sleep 10
          done
      
      - name: Install latest Trivy version
        run: |
          ssh -o StrictHostKeyChecking=no -i private_key.pem ec2-user@${{ steps.launch.outputs.instance_ip }} << 'EOF'
            # Get latest version from GitHub API
            LATEST_VERSION=$(curl -s https://api.github.com/repos/aquasecurity/trivy/releases/latest | grep -oP '"tag_name": "\Kv\d+\.\d+\.\d+' | sed 's/v//')
            echo "Latest Trivy version: $LATEST_VERSION"
            
            # Download and install
            wget https://github.com/aquasecurity/trivy/releases/download/v${LATEST_VERSION}/trivy_${LATEST_VERSION}_Linux-64bit.rpm
            sudo rpm -ivh trivy_${LATEST_VERSION}_Linux-64bit.rpm
            rm trivy_${LATEST_VERSION}_Linux-64bit.rpm
            
            trivy --version
          EOF
      
      - name: Run Trivy filesystem scan
        id: trivy_scan
        run: |
          ssh -o StrictHostKeyChecking=no -i private_key.pem ec2-user@${{ steps.launch.outputs.instance_ip }} << 'EOF' > trivy_output.txt
            # Run Trivy scan on root filesystem
            trivy filesystem \
              --severity CRITICAL,HIGH,MEDIUM \
              --format json \
              --output /tmp/trivy_results.json \
              --exit-code 0 \
              --ignore-unfixed \
              /
            
            # Count vulnerabilities by severity
            python3 << 'PYTHON'
          import json
          try:
              with open('/tmp/trivy_results.json', 'r') as f:
                  data = json.load(f)
              
              vuln_counts = {'CRITICAL': 0, 'HIGH': 0, 'MEDIUM': 0, 'LOW': 0}
              total_vulns = 0
              
              for result in data.get('Results', []):
                  for vuln in result.get('Vulnerabilities', []):
                      severity = vuln.get('Severity', 'UNKNOWN')
                      if severity in vuln_counts:
                          vuln_counts[severity] += 1
                          total_vulns += 1
              
              print(f"CRITICAL_COUNT={vuln_counts['CRITICAL']}")
              print(f"HIGH_COUNT={vuln_counts['HIGH']}")
              print(f"MEDIUM_COUNT={vuln_counts['MEDIUM']}")
              print(f"TOTAL_COUNT={total_vulns}")
              
              # Write summary file
              with open('/tmp/vulnerability_summary.json', 'w') as sf:
                  json.dump({
                      'total_vulnerabilities': total_vulns,
                      'severity_breakdown': vuln_counts,
                      'scan_date': '$(date -Iseconds)'
                  }, sf, indent=2)
              
          except Exception as e:
              print(f"Error parsing results: {e}")
              print("TOTAL_COUNT=0")
              print("CRITICAL_COUNT=0")
              print("HIGH_COUNT=0")
              print("MEDIUM_COUNT=0")
          PYTHON
          EOF
          
          # Parse output
          TOTAL_VULNS=$(grep "TOTAL_COUNT=" trivy_output.txt | cut -d'=' -f2)
          CRITICAL_VULNS=$(grep "CRITICAL_COUNT=" trivy_output.txt | cut -d'=' -f2)
          HIGH_VULNS=$(grep "HIGH_COUNT=" trivy_output.txt | cut -d'=' -f2)
          MEDIUM_VULNS=$(grep "MEDIUM_COUNT=" trivy_output.txt | cut -d'=' -f2)
          
          echo "total_vulnerabilities=$TOTAL_VULNS" >> $GITHUB_OUTPUT
          echo "critical_count=$CRITICAL_VULNS" >> $GITHUB_OUTPUT
          echo "high_count=$HIGH_VULNS" >> $GITHUB_OUTPUT
          echo "medium_count=$MEDIUM_VULNS" >> $GITHUB_OUTPUT
          
          echo "=== Vulnerability Scan Results ==="
          echo "Total Vulnerabilities: $TOTAL_VULNS"
          echo "Critical: $CRITICAL_VULNS"
          echo "High: $HIGH_VULNS"
          echo "Medium: $MEDIUM_VULNS"
          
          # Download results from instance
          scp -o StrictHostKeyChecking=no -i private_key.pem ec2-user@${{ steps.launch.outputs.instance_ip }}:/tmp/trivy_results.json ./reports/trivy_results.json 2>/dev/null || echo "No results file found"
          scp -o StrictHostKeyChecking=no -i private_key.pem ec2-user@${{ steps.launch.outputs.instance_ip }}:/tmp/vulnerability_summary.json ./reports/vulnerability_summary.json 2>/dev/null || echo "No summary file found"
      
      - name: Generate HTML report from Trivy results
        run: |
          python3 scripts/trivy_report_generator.py \
            --report-file ./reports/trivy_results.json \
            --output-dir ./reports \
            --ami-id ${{ steps.get_ami.outputs.ami_id }} \
            --os-type rhel
      
      - name: Decision Logic - Tag AMI based on scan results
        run: |
          TOTAL_VULNS="${{ steps.trivy_scan.outputs.total_vulnerabilities }}"
          CRITICAL_VULNS="${{ steps.trivy_scan.outputs.critical_count }}"
          HIGH_VULNS="${{ steps.trivy_scan.outputs.high_count }}"
          
          if [ "$TOTAL_VULNS" == "0" ]; then
            # No vulnerabilities found
            aws ec2 create-tags \
              --region ${{ env.AWS_REGION }} \
              --resources ${{ steps.get_ami.outputs.ami_id }} \
              --tags Key=hardened,Value=true \
                    Key=security,Value=passed \
                    Key=scan-status,Value=clean \
                    Key=scan-date,Value=$(date +%Y-%m-%d) \
                    Key=scanned-by,Value=Trivy \
                    Key=os-type,Value=RHEL
            echo "✅ AMI is CLEAN - No vulnerabilities found"
            echo "status=passed" >> $GITHUB_OUTPUT
          else
            # Vulnerabilities found
            REPORT_DATE=$(date +%Y-%m-%d-%H%M%S)
            
            # Upload reports to S3 (if bucket configured)
            if [ -n "${{ secrets.REPORT_BUCKET }}" ]; then
              aws s3 cp ./reports/trivy_report.html \
                s3://${{ secrets.REPORT_BUCKET }}/failures/rhel/$REPORT_DATE.html 2>/dev/null || true
              aws s3 cp ./reports/trivy_results.json \
                s3://${{ secrets.REPORT_BUCKET }}/failures/rhel/$REPORT_DATE.json 2>/dev/null || true
            fi
            
            # Tag AMI as failed
            aws ec2 create-tags \
              --region ${{ env.AWS_REGION }} \
              --resources ${{ steps.get_ami.outputs.ami_id }} \
              --tags Key=hardened,Value=false \
                    Key=security,Value=failed \
                    Key=scan-status,Value=vulnerable \
                    Key=vulnerability-count,Value=$TOTAL_VULNS \
                    Key=critical-count,Value=$CRITICAL_VULNS \
                    Key=high-count,Value=$HIGH_VULNS \
                    Key=scanned-by,Value=Trivy \
                    Key=os-type,Value=RHEL
            
            echo "❌ AMI has VULNERABILITIES - Total: $TOTAL_VULNS (Critical: $CRITICAL_VULNS, High: $HIGH_VULNS)"
            echo "status=failed" >> $GITHUB_OUTPUT
            
            # Fail the job if critical vulnerabilities found
            if [ "$CRITICAL_VULNS" -gt 0 ] && [ "${{ github.event.inputs.force_build }}" != "true" ]; then
              echo "Critical vulnerabilities found! Failing the pipeline."
              exit 1
            fi
          fi
      
      - name: Cleanup test instance
        if: always()
        run: |
          if [ -n "${{ steps.launch.outputs.instance_id }}" ]; then
            aws ec2 terminate-instances \
              --region ${{ env.AWS_REGION }} \
              --instance-ids ${{ steps.launch.outputs.instance_id }}
            echo "Terminated instance: ${{ steps.launch.outputs.instance_id }}"
          fi
          rm -f private_key.pem
      
      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports-rhel-${{ github.run_id }}
          path: |
            ./reports/*.html
            ./reports/*.json
          retention-days: 30
      
      - name: Upload Trivy results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ./reports/trivy_results.sarif
        continue-on-error: true

  security-compliance-report:
    runs-on: ubuntu-latest
    needs: [vulnerability-scan]
    if: always()
    
    steps:
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: ./all-reports
      
      - name: Generate compliance summary
        run: |
          cat > compliance-summary.md << 'EOF'
          # AMI Security Compliance Report - RHEL (Trivy Scanner)
          
          ## Pipeline Execution Details
          - **Date**: $(date)
          - **Region**: ap-south-1
          - **OS**: RHEL 9
          - **Scanner**: Trivy (Open Source)
          - **Trigger**: ${{ github.event_name }}
          - **Run ID**: ${{ github.run_id }}
          - **Status**: Completed
          
          ## Scan Results Summary
          EOF
          
          # Add vulnerability summary if available
          if [ -f ./all-reports/*/vulnerability_summary.json ]; then
            echo "" >> compliance-summary.md
            echo "\`\`\`json" >> compliance-summary.md
            cat ./all-reports/*/vulnerability_summary.json >> compliance-summary.md 2>/dev/null || echo "No summary data"
            echo "\`\`\`" >> compliance-summary.md
          fi
          
          echo "" >> compliance-summary.md
          echo "## Overall Status" >> compliance-summary.md
          echo "✅ Pipeline completed successfully" >> compliance-summary.md
          echo "" >> compliance-summary.md
          echo "## Remediation" >> compliance-summary.md
          echo "For vulnerabilities found, please review the detailed reports in the artifacts section." >> compliance-summary.md
          
          cat compliance-summary.md
      
      - name: Upload compliance report
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report
          path: compliance-summary.md