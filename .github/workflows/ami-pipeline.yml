name: AMI Security Pipeline - ap-south-1

on:
  schedule:
    - cron: '0 12 * * *'  # Daily at 12:00 PM UTC (5:30 PM IST)
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  AWS_DEFAULT_REGION: ap-south-1
  PACKER_LOG: 1
  ANSIBLE_HOST_KEY_CHECKING: False
  TRIVY_SEVERITY: 'CRITICAL,HIGH,MEDIUM'

jobs:
  fetch-latest-amis:
    runs-on: ubuntu-latest
    outputs:
      rhel_ami: ${{ steps.fetch.outputs.rhel_ami }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Fetch latest RHEL AMI
        id: fetch
        run: |
          chmod +x scripts/fetch_ami.sh
          ./scripts/fetch_ami.sh ./reports
          echo "rhel_ami=$(jq -r '.amis.rhel.ami_id' reports/latest_amis.json)" >> $GITHUB_OUTPUT
      
      - name: Upload AMI info
        uses: actions/upload-artifact@v4
        with:
          name: ami-info
          path: reports/latest_amis.json

  build-and-harden:
    needs: fetch-latest-amis
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      built_ami_id: ${{ steps.set_output.outputs.built_ami_id }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Setup Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: 'latest'
      
      - name: Setup Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible ansible-lint boto3 botocore
          cd ansible
          ansible-galaxy collection install community.general amazon.aws
      
      - name: Validate Packer template
        run: |
          cd packer
          packer init .
          packer validate .
      
      - name: Build AMI with Packer (includes Ansible hardening)
        id: packer_build
        run: |
          cd packer
          BUILD_TIMESTAMP=$(date -Iseconds)
          BUILD_ID=$(echo "$GITHUB_SHA" | cut -c1-7)
          packer init .
          packer build -machine-readable \
            -var-file=variables.pkrvars.hcl \
            -var "build_timestamp=$BUILD_TIMESTAMP" \
            -var "build_id=$BUILD_ID" \
            -only=amazon-ebs.rhel . 2>&1 | tee build.log
          
          AMI_ID=$(grep -oE 'ami-[0-9a-f]{17}' build.log | head -1)
          if [ -z "$AMI_ID" ]; then
            AMI_ID=$(grep -oE 'ami-[0-9a-f]{8}' build.log | head -1)
          fi
          
          if [ -z "$AMI_ID" ]; then
            echo "Failed to extract AMI ID from build log"
            exit 1
          fi
          
          echo "ami_id=$AMI_ID" >> $GITHUB_OUTPUT
          echo "built_ami_id=$AMI_ID" >> $GITHUB_OUTPUT
          echo "Built AMI: $AMI_ID"
        
      - name: Wait for AMI to be ready
        timeout-minutes: 60
        run: |
          aws ec2 wait image-available --region ${{ env.AWS_REGION }} --image-ids ${{ steps.packer_build.outputs.ami_id }}
          echo "AMI ${{ steps.packer_build.outputs.ami_id }} is ready"
      
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packer-build-log-${{ github.run_id }}
          path: packer/build.log
      
      - name: Set AMI output
        id: set_output
        run: |
          echo "built_ami_id=${{ steps.packer_build.outputs.ami_id }}" >> $GITHUB_OUTPUT

  vulnerability-scan:
    needs: build-and-harden
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Get AMI ID from build output
        id: get_ami
        run: |
          AMI_ID="${{ needs.build-and-harden.outputs.built_ami_id }}"
          if [ -z "$AMI_ID" ]; then
            echo "No AMI ID found from build-and-harden outputs" >&2
            exit 1
          fi
          echo "ami_id=$AMI_ID" >> $GITHUB_OUTPUT
          echo "Found AMI: $AMI_ID"
      
      - name: Launch test instance
        id: launch
        run: |
          INSTANCE_ID=$(aws ec2 run-instances \
            --region ${{ env.AWS_REGION }} \
            --image-id ${{ steps.get_ami.outputs.ami_id }} \
            --instance-type t3.micro \
            --key-name ami-hardening \
            --associate-public-ip-address \
            --security-group-ids ${{ secrets.SECURITY_GROUP_ID }} \
            --subnet-id ${{ secrets.SUBNET_ID }} \
            --tag-specifications 'ResourceType=instance,Tags=[{Key=Name,Value=Trivy-Scan-Test}]' \
            --query 'Instances[0].InstanceId' \
            --output text)
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "Launched instance: $INSTANCE_ID"
          
          aws ec2 wait instance-running --region ${{ env.AWS_REGION }} --instance-ids $INSTANCE_ID
          
          INSTANCE_IP=$(aws ec2 describe-instances \
            --region ${{ env.AWS_REGION }} \
            --instance-ids $INSTANCE_ID \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          echo "instance_ip=$INSTANCE_IP" >> $GITHUB_OUTPUT
          
          sleep 60
      
      - name: Setup SSH
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem
          
          for i in {1..30}; do
            if ssh -o StrictHostKeyChecking=no -i private_key.pem -o ConnectTimeout=5 ec2-user@${{ steps.launch.outputs.instance_ip }} "echo 'SSH ready'" 2>/dev/null; then
              break
            fi
            sleep 10
          done
      
      - name: Install Trivy
        run: |
          ssh -o StrictHostKeyChecking=no -i private_key.pem ec2-user@${{ steps.launch.outputs.instance_ip }} << 'EOF'
            sudo tee /etc/yum.repos.d/trivy.repo << 'REPO'
          [trivy]
          name=Trivy
          baseurl=https://aquasecurity.github.io/trivy-repo/rpm/releases/9/x86_64/
          gpgcheck=0
          enabled=1
          REPO
            sudo yum clean all
            sudo yum install -y trivy
          EOF
      
      - name: Run Trivy scan
        id: trivy_scan
        run: |
          ssh -o StrictHostKeyChecking=no -i private_key.pem ec2-user@${{ steps.launch.outputs.instance_ip }} << 'EOF' > trivy_results.txt
            trivy filesystem --severity CRITICAL,HIGH,MEDIUM --exit-code 0 --scanners vuln --skip-dirs /proc,/sys,/dev / 2>&1 | tee /tmp/scan.txt
            CRITICAL=$(grep -c "CRITICAL" /tmp/scan.txt || echo "0")
            HIGH=$(grep -c "HIGH" /tmp/scan.txt || echo "0")
            MEDIUM=$(grep -c "MEDIUM" /tmp/scan.txt || echo "0")
            TOTAL=$((CRITICAL + HIGH + MEDIUM))
            echo "CRITICAL_COUNT=$CRITICAL"
            echo "HIGH_COUNT=$HIGH"
            echo "MEDIUM_COUNT=$MEDIUM"
            echo "TOTAL_COUNT=$TOTAL"
          EOF
          
          TOTAL=$(grep "TOTAL_COUNT=" trivy_results.txt | cut -d'=' -f2 | tail -1)
          CRITICAL=$(grep "CRITICAL_COUNT=" trivy_results.txt | cut -d'=' -f2 | tail -1)
          HIGH=$(grep "HIGH_COUNT=" trivy_results.txt | cut -d'=' -f2 | tail -1)
          
          echo "total_vulnerabilities=${TOTAL:-0}" >> $GITHUB_OUTPUT
          echo "critical_count=${CRITICAL:-0}" >> $GITHUB_OUTPUT
          echo "high_count=${HIGH:-0}" >> $GITHUB_OUTPUT
      
      - name: Process Clean AMI (No Vulnerabilities)
        if: steps.trivy_scan.outputs.total_vulnerabilities == '0'
        run: |
          AMI_ID="${{ steps.get_ami.outputs.ami_id }}"
          MY_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          
          # Tag the AMI
          aws ec2 create-tags \
            --region ${{ env.AWS_REGION }} \
            --resources $AMI_ID \
            --tags Key=hardened,Value=true \
                  Key=security,Value=passed \
                  Key=scan-status,Value=clean \
                  Key=scan-date,Value=$(date +%Y-%m-%d) \
                  Key=scanned-by,Value=Trivy
          
          # Ensure AMI is private (only in this account)
          aws ec2 modify-image-attribute \
            --region ${{ env.AWS_REGION }} \
            --image-id $AMI_ID \
            --launch-permission "{\"Remove\":[{\"Group\":\"all\"}]}" 2>/dev/null || true
          
          echo "✅ AMI is CLEAN - No vulnerabilities"
          echo "✅ AMI ID: $AMI_ID"
          echo "✅ Location: Your AWS Account ($MY_ACCOUNT) - Private"
          echo "✅ View at: https://console.aws.amazon.com/ec2/home?region=${{ env.AWS_REGION }}#Images:visibility=owned-by-me"
      
      - name: Process Vulnerable AMI
        if: steps.trivy_scan.outputs.total_vulnerabilities != '0' && steps.trivy_scan.outputs.total_vulnerabilities != ''
        run: |
          AMI_ID="${{ steps.get_ami.outputs.ami_id }}"
          TOTAL="${{ steps.trivy_scan.outputs.total_vulnerabilities }}"
          
          aws ec2 create-tags \
            --region ${{ env.AWS_REGION }} \
            --resources $AMI_ID \
            --tags Key=hardened,Value=false \
                  Key=security,Value=failed \
                  Key=scan-status,Value=vulnerable \
                  Key=vulnerability-count,Value=$TOTAL
          
          echo "❌ AMI has $TOTAL vulnerabilities"
          echo "⚠️ AMI kept private for review"
          
          if [ "${{ steps.trivy_scan.outputs.critical_count }}" -gt 0 ] && [ "${{ github.event.inputs.force_build }}" != "true" ]; then
            exit 1
          fi
      
      - name: Cleanup
        if: always()
        run: |
          if [ -n "${{ steps.launch.outputs.instance_id }}" ]; then
            aws ec2 terminate-instances --region ${{ env.AWS_REGION }} --instance-ids ${{ steps.launch.outputs.instance_id }}
          fi
          rm -f private_key.pem
      
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-results
          path: trivy_results.txt