name: AMI Security Pipeline - ap-south-1

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

env:
  AWS_REGION: ap-south-1
  AWS_DEFAULT_REGION: ap-south-1
  PACKER_LOG: 1

jobs:

  build-and-harden:

    runs-on: ubuntu-latest
    timeout-minutes: 180

    outputs:
      built_ami_id: ${{ steps.ami.outputs.ami_id }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Packer
        uses: hashicorp/setup-packer@v3

      - name: Setup Ansible
        run: |
          python -m pip install --upgrade pip

          pip install \
            ansible \
            ansible-lint \
            boto3 \
            botocore

          cd ansible

          ansible-galaxy collection install \
            community.general \
            amazon.aws

      - name: Validate Packer Template
        run: |
          cd packer

          packer init .

          packer fmt -check .

          packer validate .

      - name: Build Hardened AMI
        id: build
        run: |

          cd packer

          packer build \
            -color=false \
            -machine-readable \
            -var-file=variables.pkrvars.hcl \
            . | tee build.log

      - name: Extract AMI ID
        id: ami
        run: |

          cd packer

          AMI_ID=$(jq -r '.builds[-1].artifact_id' manifest-rhel.json | cut -d: -f2)

          if [ -z "$AMI_ID" ] || [ "$AMI_ID" = "null" ]; then
            echo "AMI extraction failed"
            exit 1
          fi

          echo "ami_id=$AMI_ID" >> $GITHUB_OUTPUT

          echo "Built AMI: $AMI_ID"

      - name: Wait For AMI Availability
        run: |
          aws ec2 wait image-available \
            --image-ids ${{ steps.ami.outputs.ami_id }}

      - name: Upload Build Logs
        uses: actions/upload-artifact@v4
        with:
          name: packer-build-logs
          path: |
            packer/build.log
            packer/manifest-rhel.json

  vulnerability-scan:

    needs: build-and-harden
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Launch Scan Instance
        id: launch
        run: |

          INSTANCE_ID=$(aws ec2 run-instances \
            --image-id ${{ needs.build-and-harden.outputs.built_ami_id }} \
            --instance-type t3.micro \
            --key-name ami-hardening \
            --associate-public-ip-address \
            --security-group-ids ${{ secrets.SECURITY_GROUP_ID }} \
            --subnet-id ${{ secrets.SUBNET_ID }} \
            --tag-specifications 'ResourceType=instance,Tags=[{Key=Name,Value=AMI-Scan-Instance}]' \
            --query 'Instances[0].InstanceId' \
            --output text)

          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT

          aws ec2 wait instance-running \
            --instance-ids $INSTANCE_ID

          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids $INSTANCE_ID \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)

          echo "public_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT

      - name: Configure SSH
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > private_key.pem

          chmod 600 private_key.pem

      - name: Wait For SSH
        run: |

          for i in {1..30}; do

            ssh \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=5 \
              -i private_key.pem \
              ec2-user@${{ steps.launch.outputs.public_ip }} \
              "echo SSH Ready" && break

            echo "Waiting for SSH..."

            sleep 10

          done

      - name: Install Trivy
        run: |

          ssh \
            -o StrictHostKeyChecking=no \
            -i private_key.pem \
            ec2-user@${{ steps.launch.outputs.public_ip }} << 'EOF'

          sudo tee /etc/yum.repos.d/trivy.repo > /dev/null << 'REPO'
          [trivy]
          name=Trivy
          baseurl=https://aquasecurity.github.io/trivy-repo/rpm/releases/9/x86_64/
          enabled=1
          gpgcheck=0
          REPO

          sudo yum clean all

          sudo yum install -y trivy

          trivy --version

          EOF

      - name: Run Trivy Scan
        id: trivy
        run: |

          ssh \
            -o StrictHostKeyChecking=no \
            -i private_key.pem \
            ec2-user@${{ steps.launch.outputs.public_ip }} << 'EOF'

          sudo trivy rootfs \
            --severity CRITICAL,HIGH,MEDIUM \
            --format json \
            -o /tmp/trivy.json \
            /

          sudo trivy rootfs \
            --severity CRITICAL,HIGH,MEDIUM \
            --format sarif \
            -o /tmp/trivy.sarif \
            /

          sudo trivy rootfs \
            --severity CRITICAL,HIGH,MEDIUM \
            / | tee /tmp/trivy-summary.txt

          EOF

      - name: Copy Reports
        run: |

          mkdir -p reports

          scp \
            -o StrictHostKeyChecking=no \
            -i private_key.pem \
            ec2-user@${{ steps.launch.outputs.public_ip }}:/tmp/trivy* \
            reports/

      - name: Tag AMI - Passed
        if: success()
        run: |

          aws ec2 create-tags \
            --resources ${{ needs.build-and-harden.outputs.built_ami_id }} \
            --tags \
              Key=Hardened,Value=true \
              Key=SecurityStatus,Value=Passed \
              Key=Compliance,Value=CIS-Level1 \
              Key=ScannedBy,Value=Trivy \
              Key=Environment,Value=Production

      - name: Tag AMI - Failed
        if: failure()
        run: |

          aws ec2 create-tags \
            --resources ${{ needs.build-and-harden.outputs.built_ami_id }} \
            --tags \
              Key=Hardened,Value=false \
              Key=SecurityStatus,Value=Failed \
              Key=Quarantine,Value=true \
              Key=ScannedBy,Value=Trivy

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-reports
          path: reports/

      - name: Upload SARIF To Security Tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/trivy.sarif

      - name: Cleanup Scan Instance
        if: always()
        run: |

          aws ec2 terminate-instances \
            --instance-ids ${{ steps.launch.outputs.instance_id }}

          rm -f private_key.pem