name: AMI Security Pipeline - ap-south-1

on:
  schedule:
    - cron: '0 12 * * *'  # Daily at 12:00 PM UTC
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if vulnerabilities?'
        required: false
        type: boolean

env:
  AWS_REGION: ap-south-1
  AWS_DEFAULT_REGION: ap-south-1
  PACKER_LOG: 1
  ANSIBLE_HOST_KEY_CHECKING: False

jobs:
  # Job 1: Build initial AMI with Packer
  build-initial-ami:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      initial_ami_id: ${{ steps.packer_build.outputs.ami_id }}
      initial_ami_name: ${{ steps.packer_build.outputs.ami_name }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: 'latest'

      - name: Setup Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible ansible-lint boto3 botocore
          cd ansible
          ansible-galaxy collection install community.general amazon.aws

      - name: Validate Packer template
        run: |
          cd packer
          packer init .
          packer validate .

      - name: Build Initial AMI with Packer
        id: packer_build
        run: |
          cd packer
          BUILD_TIMESTAMP=$(date -Iseconds)
          BUILD_ID=$(echo "$GITHUB_SHA" | cut -c1-7)
          
          packer build -machine-readable \
            -var "build_timestamp=$BUILD_TIMESTAMP" \
            -var "build_id=$BUILD_ID" \
            -only=amazon-ebs.rhel \
            . 2>&1 | tee build.log
          
          # Extract AMI ID
          AMI_ID=$(grep -oE 'ami-[0-9a-f]{17}' build.log | head -1)
          if [ -z "$AMI_ID" ]; then
            AMI_ID=$(grep -oE 'ami-[0-9a-f]{8}' build.log | head -1)
          fi
          
          if [ -z "$AMI_ID" ]; then
            echo "Failed to extract AMI ID from build log"
            cat build.log
            exit 1
          fi
          
          echo "ami_id=$AMI_ID" >> $GITHUB_OUTPUT
          echo "ami_name=rhel-9-initial-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
          echo "Built Initial AMI: $AMI_ID"

      - name: Wait for AMI to be ready
        run: |
          aws ec2 wait image-available --region ${{ env.AWS_REGION }} --image-ids ${{ steps.packer_build.outputs.ami_id }}
          echo "AMI ${{ steps.packer_build.outputs.ami_id }} is ready"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packer-build-log-${{ github.run_id }}
          path: packer/build.log

  # Job 2: Launch instance, run Ansible playbooks, create new AMI
  apply-ansible-and-create-ami:
    needs: build-initial-ami
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      final_ami_id: ${{ steps.create_ami.outputs.ami_id }}
      final_ami_name: ${{ steps.create_ami.outputs.ami_name }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Initial AMI ID
        id: get_ami
        run: |
          AMI_ID="${{ needs.build-initial-ami.outputs.initial_ami_id }}"
          echo "ami_id=$AMI_ID" >> $GITHUB_OUTPUT
          echo "Initial AMI ID: $AMI_ID"

      - name: Launch EC2 instance from initial AMI
        id: launch
        run: |
          INSTANCE_ID=$(aws ec2 run-instances \
            --region ${{ env.AWS_REGION }} \
            --image-id ${{ steps.get_ami.outputs.ami_id }} \
            --instance-type t3.micro \
            --key-name ami-hardening \
            --associate-public-ip-address \
            --security-group-ids ${{ secrets.SECURITY_GROUP_ID }} \
            --subnet-id ${{ secrets.SUBNET_ID }} \
            --tag-specifications 'ResourceType=instance,Tags=[{Key=Name,Value=Ansible-Hardening-Instance}]' \
            --query 'Instances[0].InstanceId' \
            --output text)
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "Launched instance: $INSTANCE_ID"

          aws ec2 wait instance-running --region ${{ env.AWS_REGION }} --instance-ids $INSTANCE_ID

          INSTANCE_IP=$(aws ec2 describe-instances \
            --region ${{ env.AWS_REGION }} \
            --instance-ids $INSTANCE_ID \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          echo "instance_ip=$INSTANCE_IP" >> $GITHUB_OUTPUT
          echo "Instance IP: $INSTANCE_IP"
          
          sleep 60

      - name: Setup SSH key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Wait for SSH to be ready
        run: |
          for i in {1..30}; do
            if ssh -o StrictHostKeyChecking=no -i private_key.pem -o ConnectTimeout=5 ec2-user@${{ steps.launch.outputs.instance_ip }} "echo 'SSH ready'" 2>/dev/null; then
              echo "SSH is ready"
              break
            fi
            echo "Waiting for SSH... ($i/30)"
            sleep 10
          done

      - name: Copy Ansible files to EC2 instance
        run: |
          ssh -o StrictHostKeyChecking=no -i private_key.pem ec2-user@${{ steps.launch.outputs.instance_ip }} "mkdir -p /home/ec2-user/ansible"
          scp -o StrictHostKeyChecking=no -i private_key.pem -r ./ansible/* ec2-user@${{ steps.launch.outputs.instance_ip }}:/home/ec2-user/ansible/

      - name: Install Python and Ansible on EC2 instance
        run: |
          ssh -o StrictHostKeyChecking=no -i private_key.pem ec2-user@${{ steps.launch.outputs.instance_ip }} << 'EOF'
            sudo dnf install -y python3 python3-pip
            sudo pip3 install ansible
            ansible --version
          EOF

      - name: Run Ansible playbooks on EC2 instance
        run: |
          ssh -o StrictHostKeyChecking=no -i private_key.pem ec2-user@${{ steps.launch.outputs.instance_ip }} << 'EOF'
            cd /home/ec2-user/ansible
            ansible-playbook playbook.yml --connection=local --inventory localhost, --extra-vars "ansible_python_interpreter=/usr/bin/python3"
            echo "Ansible hardening completed on instance"
          EOF

      - name: Stop the EC2 instance for AMI creation
        run: |
          aws ec2 stop-instances --region ${{ env.AWS_REGION }} --instance-ids ${{ steps.launch.outputs.instance_id }}
          aws ec2 wait instance-stopped --region ${{ env.AWS_REGION }} --instance-ids ${{ steps.launch.outputs.instance_id }}
          echo "Instance stopped"

      - name: Create AMI from the hardened EC2 instance
        id: create_ami
        run: |
          AMI_NAME="rhel-9-hardened-$(date +%Y%m%d-%H%M%S)"
          AMI_ID=$(aws ec2 create-image \
            --region ${{ env.AWS_REGION }} \
            --instance-id ${{ steps.launch.outputs.instance_id }} \
            --name "$AMI_NAME" \
            --description "Hardened RHEL 9 AMI with Ansible hardening applied" \
            --no-reboot \
            --tag-specifications 'ResourceType=image,Tags=[{Key=Name,Value=RHEL-Hardened-AMI},{Key=Environment,Value=Production},{Key=Hardened,Value=true},{Key=Source,Value=Ansible}]' \
            --query 'ImageId' \
            --output text)
          
          echo "ami_id=$AMI_ID" >> $GITHUB_OUTPUT
          echo "ami_name=$AMI_NAME" >> $GITHUB_OUTPUT
          echo "Created AMI: $AMI_ID"

      - name: Wait for AMI to be ready
        run: |
          aws ec2 wait image-available --region ${{ env.AWS_REGION }} --image-ids ${{ steps.create_ami.outputs.ami_id }}
          echo "AMI ${{ steps.create_ami.outputs.ami_id }} is ready"

      - name: Add additional tags to AMI
        run: |
          aws ec2 create-tags \
            --region ${{ env.AWS_REGION }} \
            --resources ${{ steps.create_ami.outputs.ami_id }} \
            --tags Key=Stage,Value=pre-scan \
                  Key=BuildDate,Value=$(date +%Y-%m-%d) \
                  Key=BuildBy,Value=GitHubActions \
                  Key=GitHubRun,Value=${{ github.run_id }}

      - name: Cleanup EC2 instance
        if: always()
        run: |
          if [ -n "${{ steps.launch.outputs.instance_id }}" ]; then
            aws ec2 terminate-instances \
              --region ${{ env.AWS_REGION }} \
              --instance-ids ${{ steps.launch.outputs.instance_id }}
            echo "Terminated instance: ${{ steps.launch.outputs.instance_id }}"
          fi
          rm -f private_key.pem

  # Job 3: Vulnerability scan on the hardened AMI
  vulnerability-scan:
    needs: apply-ansible-and-create-ami
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Final AMI ID
        id: get_ami
        run: |
          AMI_ID="${{ needs.apply-ansible-and-create-ami.outputs.final_ami_id }}"
          if [ -z "$AMI_ID" ]; then
            echo "No AMI ID found" >&2
            exit 1
          fi
          echo "ami_id=$AMI_ID" >> $GITHUB_OUTPUT
          echo "Final AMI ID: $AMI_ID"

      - name: Launch test instance from hardened AMI
        id: launch
        run: |
          INSTANCE_ID=$(aws ec2 run-instances \
            --region ${{ env.AWS_REGION }} \
            --image-id ${{ steps.get_ami.outputs.ami_id }} \
            --instance-type t3.micro \
            --key-name ami-hardening \
            --associate-public-ip-address \
            --security-group-ids ${{ secrets.SECURITY_GROUP_ID }} \
            --subnet-id ${{ secrets.SUBNET_ID }} \
            --tag-specifications 'ResourceType=instance,Tags=[{Key=Name,Value=Vulnerability-Scan-Test}]' \
            --query 'Instances[0].InstanceId' \
            --output text)
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "Launched instance: $INSTANCE_ID"

          aws ec2 wait instance-running --region ${{ env.AWS_REGION }} --instance-ids $INSTANCE_ID

          INSTANCE_IP=$(aws ec2 describe-instances \
            --region ${{ env.AWS_REGION }} \
            --instance-ids $INSTANCE_ID \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          echo "instance_ip=$INSTANCE_IP" >> $GITHUB_OUTPUT
          echo "Instance IP: $INSTANCE_IP"
          
          sleep 60

      - name: Setup SSH key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Wait for SSH
        run: |
          for i in {1..30}; do
            if ssh -o StrictHostKeyChecking=no -i private_key.pem -o ConnectTimeout=5 ec2-user@${{ steps.launch.outputs.instance_ip }} "echo 'SSH ready'" 2>/dev/null; then
              echo "SSH is ready"
              break
            fi
            echo "Waiting for SSH... ($i/30)"
            sleep 10
          done

      - name: Install Trivy
        run: |
          ssh -o StrictHostKeyChecking=no -i private_key.pem ec2-user@${{ steps.launch.outputs.instance_ip }} << 'EOF'
            sudo tee /etc/yum.repos.d/trivy.repo << 'REPO'
[trivy]
name=Trivy
baseurl=https://aquasecurity.github.io/trivy-repo/rpm/releases/9/x86_64/
gpgcheck=0
enabled=1
REPO
            sudo yum clean all
            sudo yum install -y trivy
            trivy --version
          EOF

      - name: Run Trivy scan
        id: trivy_scan
        run: |
          ssh -o StrictHostKeyChecking=no -i private_key.pem ec2-user@${{ steps.launch.outputs.instance_ip }} << 'EOF'
            trivy filesystem \
              --severity CRITICAL,HIGH,MEDIUM \
              --exit-code 0 \
              --scanners vuln \
              --skip-dirs /proc,/sys,/dev \
              / 2>&1 | tee /tmp/scan_output.txt
            
            CRITICAL=$(grep -c "CRITICAL" /tmp/scan_output.txt || echo "0")
            HIGH=$(grep -c "HIGH" /tmp/scan_output.txt || echo "0")
            MEDIUM=$(grep -c "MEDIUM" /tmp/scan_output.txt || echo "0")
            TOTAL=$((CRITICAL + HIGH + MEDIUM))
            
            echo "CRITICAL_COUNT=$CRITICAL"
            echo "HIGH_COUNT=$HIGH"
            echo "MEDIUM_COUNT=$MEDIUM"
            echo "TOTAL_COUNT=$TOTAL"
          EOF > trivy_results.txt
          
          TOTAL=$(grep "TOTAL_COUNT=" trivy_results.txt | cut -d'=' -f2 | tail -1)
          CRITICAL=$(grep "CRITICAL_COUNT=" trivy_results.txt | cut -d'=' -f2 | tail -1)
          HIGH=$(grep "HIGH_COUNT=" trivy_results.txt | cut -d'=' -f2 | tail -1)
          MEDIUM=$(grep "MEDIUM_COUNT=" trivy_results.txt | cut -d'=' -f2 | tail -1)
          
          echo "total_vulnerabilities=${TOTAL:-0}" >> $GITHUB_OUTPUT
          echo "critical_count=${CRITICAL:-0}" >> $GITHUB_OUTPUT
          echo "high_count=${HIGH:-0}" >> $GITHUB_OUTPUT
          echo "medium_count=${MEDIUM:-0}" >> $GITHUB_OUTPUT

          echo "=== Scan Results ==="
          echo "Total: ${TOTAL:-0} | Critical: ${CRITICAL:-0} | High: ${HIGH:-0} | Medium: ${MEDIUM:-0}"

      - name: Cleanup test instance
        if: always()
        run: |
          if [ -n "${{ steps.launch.outputs.instance_id }}" ]; then
            aws ec2 terminate-instances \
              --region ${{ env.AWS_REGION }} \
              --instance-ids ${{ steps.launch.outputs.instance_id }}
          fi
          rm -f private_key.pem

      - name: Final AMI Tagging based on scan results
        run: |
          TOTAL="${{ steps.trivy_scan.outputs.total_vulnerabilities }}"
          CRITICAL="${{ steps.trivy_scan.outputs.critical_count }}"
          AMI_ID="${{ steps.get_ami.outputs.ami_id }}"
          
          if [ "$TOTAL" == "0" ] || [ -z "$TOTAL" ]; then
            echo "✅ No vulnerabilities found! Tagging AMI as hardened and secure"
            
            aws ec2 create-tags \
              --region ${{ env.AWS_REGION }} \
              --resources $AMI_ID \
              --tags Key=hardened,Value=true \
                    Key=security,Value=passed \
                    Key=scan-status,Value=clean \
                    Key=scan-date,Value=$(date +%Y-%m-%d) \
                    Key=scanned-by,Value=Trivy \
                    Key=production-ready,Value=true
            
            # Make AMI private (owned by your account)
            aws ec2 modify-image-attribute \
              --region ${{ env.AWS_REGION }} \
              --image-id $AMI_ID \
              --launch-permission "{\"Remove\":[{\"Group\":\"all\"}]}"
            
            echo "✅ AMI is now private and tagged as production-ready"
            
          else
            echo "❌ Vulnerabilities found! Tagging AMI as failed"
            
            aws ec2 create-tags \
              --region ${{ env.AWS_REGION }} \
              --resources $AMI_ID \
              --tags Key=hardened,Value=false \
                    Key=security,Value=failed \
                    Key=scan-status,Value=vulnerable \
                    Key=vulnerability-count,Value=$TOTAL \
                    Key=critical-count,Value=$CRITICAL \
                    Key=high-count,Value=$HIGH \
                    Key=scanned-by,Value=Trivy \
                    Key=production-ready,Value=false
            
            if [ "$CRITICAL" -gt 0 ] && [ "${{ github.event.inputs.force_build }}" != "true" ]; then
              echo "Critical vulnerabilities found! Failing the pipeline."
              exit 1
            fi
          fi

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-results-${{ github.run_id }}
          path: trivy_results.txt

  # Job 4: Generate compliance report
  security-compliance-report:
    runs-on: ubuntu-latest
    needs: [vulnerability-scan]
    if: always()
    
    steps:
      - name: Generate compliance summary
        run: |
          cat > compliance-summary.md << 'EOF'
          # AMI Security Compliance Report - RHEL
          
          ## Pipeline Details
          - **Date**: $(date)
          - **Region**: ap-south-1
          - **Final AMI ID**: ${{ needs.apply-ansible-and-create-ami.outputs.final_ami_id }}
          - **Initial AMI ID**: ${{ needs.build-initial-ami.outputs.initial_ami_id }}
          - **Status**: ${{ needs.vulnerability-scan.result }}
          
          ## Security Posture
          - **Hardening**: Applied via Ansible on running EC2 instance
          - **Scan Tool**: Trivy
          - **Vulnerabilities Found**: ${{ needs.vulnerability-scan.outputs.total_vulnerabilities }}
          
          This AMI has been hardened with Ansible playbooks and scanned for vulnerabilities.
          EOF
          
          cat compliance-summary.md
      
      - name: Upload compliance report
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report
          path: compliance-summary.md